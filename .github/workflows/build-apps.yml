name: Build shop apps

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build shop pages
        working-directory: frontend
        run: |
          npm install
          npm run build
      - name: Install Python and PyInstaller
        run: python -m pip install -r requirements-build.txt
      - name: Build Warung Pojok.exe
        run: python -m PyInstaller --noconfirm --clean warung.spec
      - name: Zip Windows app
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\Warung Pojok" -DestinationPath "Warung-Pojok-Windows.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Warung-Pojok-Windows
          path: Warung-Pojok-Windows.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build shop pages
        working-directory: frontend
        run: |
          npm install
          npm run build
      - name: Install Python and PyInstaller
        run: python -m pip install -r requirements-build.txt
      - name: Build Warung Pojok.app
        run: python -m PyInstaller --noconfirm --clean warung.spec
      - name: Zip macOS app
        run: ditto -c -k --keepParent "dist/Warung Pojok.app" Warung-Pojok-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Warung-Pojok-macOS
          path: Warung-Pojok-macOS.zip
