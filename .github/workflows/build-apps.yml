name: Build shop apps

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build shop pages
        working-directory: frontend
        run: |
          npm install
          npm run build
      - name: Install Python and PyInstaller
        run: python -m pip install -r requirements-build.txt
      - name: App icon
        run: python scripts/make_app_icon.py
      - name: Build Toko Bangunan Makmur.exe
        run: python -m PyInstaller --noconfirm --clean warung.spec
      - name: Zip Windows app
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\Toko Bangunan Makmur" -DestinationPath "Toko-Bangunan-Makmur-Windows.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Toko-Bangunan-Makmur-Windows
          path: Toko-Bangunan-Makmur-Windows.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build shop pages
        working-directory: frontend
        run: |
          npm install
          npm run build
      - name: Install Python and PyInstaller
        run: python -m pip install -r requirements-build.txt
      - name: App icon
        run: |
          python3 scripts/make_app_icon.py
          bash scripts/make_app_icns.sh
      - name: Build Toko Bangunan Makmur.app
        run: python -m PyInstaller --noconfirm --clean warung.spec
      - name: Zip macOS app
        run: ditto -c -k --keepParent "dist/Toko Bangunan Makmur.app" Toko-Bangunan-Makmur-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Toko-Bangunan-Makmur-macOS
          path: Toko-Bangunan-Makmur-macOS.zip
