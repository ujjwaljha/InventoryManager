name: Build shop apps

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build shop pages
        working-directory: frontend
        run: |
          npm install
          npm run build
      - name: Install Python and PyInstaller
        run: python -m pip install -r requirements-build.txt
      - name: App icon
        run: python scripts/make_app_icon.py
      - name: Build Toko Bangunan Makmur.exe
        run: python -m PyInstaller --noconfirm --clean warung.spec
      - name: Zip Windows app
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\Toko Bangunan Makmur" -DestinationPath "Toko-Bangunan-Makmur-Windows.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Toko-Bangunan-Makmur-Windows
          path: Toko-Bangunan-Makmur-Windows.zip

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build shop pages
        working-directory: frontend
        run: |
          npm install
          npm run build
      - name: Install Python and PyInstaller
        run: python -m pip install -r requirements-build.txt
      - name: App icon
        run: |
          python3 scripts/make_app_icon.py
          bash scripts/make_app_icns.sh
      - name: Build Toko Bangunan Makmur.app
        run: python -m PyInstaller --noconfirm --clean warung.spec
      - name: Fix bundled Python library
        run: python3 scripts/fix_macos_bundle.py "dist/Toko Bangunan Makmur.app"
      - name: Smoke-test embedded Python
        run: |
          APP="dist/Toko Bangunan Makmur.app"
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          fw = Path("dist/Toko Bangunan Makmur.app/Contents/Frameworks")
          z = fw / "base_library.zip"
          enc = fw / "encodings" / "__init__.py"
          has_zip = False
          if z.is_file():
              has_zip = any(n.replace("\\", "/").startswith("encodings/") for n in zipfile.ZipFile(z).namelist())
          assert has_zip or enc.is_file(), "encodings missing from Mac app"
          print("encodings ok")
          PY
          BIN="$APP/Contents/MacOS/Toko Bangunan Makmur"
          set +e
          OUT="$(perl -e 'alarm 8; exec @ARGV' "$BIN" 2>&1)"
          STATUS=$?
          set -e
          echo "$OUT"
          echo "$OUT" | grep -q "No module named 'encodings'" && exit 1
          echo "$OUT" | grep -q "Failed to start embedded python" && exit 1
          echo "$OUT" | grep -q "slice is not valid mach-o" && exit 1
          echo "smoke-test exit $STATUS (GUI start is ok)"
      - name: Ad-hoc sign and clear quarantine
        run: |
          APP="dist/Toko Bangunan Makmur.app"
          xattr -cr "$APP" || true
          codesign --force --sign - --entitlements scripts/macos_entitlements.plist "$APP/Contents/Frameworks/Python"
          codesign --force --deep --sign - --entitlements scripts/macos_entitlements.plist "$APP"
          file -b "$APP/Contents/Frameworks/Python" | grep -q "Mach-O"
          codesign --verify --verbose=2 "$APP/Contents/Frameworks/Python"
          codesign --verify --deep --verbose=2 "$APP"
      - name: Zip macOS app
        run: |
          STAGE="dist/mac-release/Toko Bangunan Makmur"
          mkdir -p "$STAGE"
          ditto "dist/Toko Bangunan Makmur.app" "$STAGE/Toko Bangunan Makmur.app"
          cp "scripts/Open Toko Bangunan Makmur.command" "$STAGE/"
          cp "scripts/macos_entitlements.plist" "$STAGE/"
          cp "scripts/macos-if-verifying-stops.txt" "$STAGE/If verifying stops.txt"
          chmod +x "$STAGE/Open Toko Bangunan Makmur.command"
          perl -pi -e 's/\r\n/\n/g' "$STAGE/Open Toko Bangunan Makmur.command"
          xattr -cr "$STAGE" || true
          ditto -c -k --keepParent "$STAGE" Toko-Bangunan-Makmur-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Toko-Bangunan-Makmur-macOS
          path: Toko-Bangunan-Makmur-macOS.zip

  release:
    needs: [windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-apps
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist-apps/Toko-Bangunan-Makmur-Windows/Toko-Bangunan-Makmur-Windows.zip
            dist-apps/Toko-Bangunan-Makmur-macOS/Toko-Bangunan-Makmur-macOS.zip
